<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Combify — the countdown ring, opened at three o'clock so it reads as a C.
       80° gap with round terminals: wide enough to be a letter at 58px, narrow
       enough to still be the ring you watch during a round. The stroke runs
       cool to warm along its length, ending on the app's own streak colour, so
       the round cools and the finish burns. -->
  <defs>
    <linearGradient id="cbGround" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#183c42"/>
      <stop offset="0.55" stop-color="#0b1e22"/>
      <stop offset="1" stop-color="#050a0c"/>
    </linearGradient>
    <linearGradient id="cbEmber" x1="0.05" y1="1" x2="0.95" y2="0">
      <stop offset="0" stop-color="#2a7d78"/>
      <stop offset="0.55" stop-color="#49c5b6"/>
      <stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
    <radialGradient id="cbTopLight" cx="0.3" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cbRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="cbGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#cbGround)"/>
  <rect width="512" height="512" rx="112" fill="url(#cbTopLight)"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="url(#cbEmber)" stroke-width="54"
          stroke-linecap="round" stroke-dasharray="694 198"
          transform="rotate(40 256 256)" filter="url(#cbGlow)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#cbRim)" stroke-width="3"/>
</svg>
